- name: Publicar Excel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVO="Reporte_Monitoreo_Agricola.xlsx"

          if [ ! -f "$ARCHIVO" ]; then
            echo "No se encontró el Excel generado"
            exit 1
          fi

          if ! gh release view reporte-actual >/dev/null 2>&1; then
            gh release create reporte-actual \
              --title "Reporte actualizado de monitoreo agrícola" \
              --notes "Reporte generado automáticamente cada 5 minutos"
          fi

          gh release upload reporte-actual "$ARCHIVO" --clobber
